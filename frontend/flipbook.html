<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flip Book Fun!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(135deg, #FFF9F0 0%, #F0F8FF 100%);
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', cursive;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px 40px;
    }

    h1 {
      font-size: 2.6em;
      color: #FF6B6B;
      text-shadow: 3px 3px 0 #FFD93D, 5px 5px 0 rgba(0,0,0,0.1);
      margin-bottom: 6px;
      letter-spacing: 2px;
    }

    .subtitle {
      color: #6C5CE7;
      font-size: 1.05em;
      margin-bottom: 22px;
      opacity: 0.85;
    }

    /* ── Book container ── */
    .flipbook {
      position: relative;
      width: 320px;
      border-radius: 14px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25), 4px 4px 0 #333;
      overflow: hidden;
      background: white;
      border: 4px solid #333;
    }

    /* Spine effect on left edge */
    .flipbook::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 12px;
      background: repeating-linear-gradient(
        to bottom,
        #E8D5B7 0px, #E8D5B7 8px,
        #D4B896 8px, #D4B896 16px
      );
      z-index: 20;
      border-right: 2px solid #B8956A;
    }

    /* ── Each flip section ── */
    .section {
      position: relative;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 3px dashed #AAA;
      overflow: hidden;
    }

    .section:last-child { border-bottom: none; }

    .section-inner {
      width: 300px;
      height: 200px;
      position: relative;
      will-change: transform;
    }

    .section-inner.flipping {
      animation: pageTurn 0.35s ease-in-out;
    }

    @keyframes pageTurn {
      0%   { transform: perspective(500px) rotateX(0deg);   opacity: 1; }
      45%  { transform: perspective(500px) rotateX(90deg);  opacity: 0.3; }
      55%  { transform: perspective(500px) rotateX(-90deg); opacity: 0.3; }
      100% { transform: perspective(500px) rotateX(0deg);   opacity: 1; }
    }

    /* ── Nav arrows ── */
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.92);
      border: 2.5px solid #444;
      border-radius: 50%;
      width: 36px; height: 36px;
      font-size: 16px;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.2);
      transition: background 0.15s, transform 0.1s;
      user-select: none;
      line-height: 1;
    }
    .nav-btn:hover  { background: #FFD93D; transform: translateY(-50%) scale(1.12); }
    .nav-btn:active { transform: translateY(-50%) scale(0.93); }
    .nav-btn.prev   { left: 16px; }
    .nav-btn.next   { right: 8px; }

    /* ── Labels & counters ── */
    .section-label {
      position: absolute;
      top: 6px; right: 12px;
      background: rgba(0,0,0,0.55);
      color: white;
      font-size: 10px;
      letter-spacing: 1px;
      padding: 2px 9px;
      border-radius: 10px;
      z-index: 5;
      pointer-events: none;
    }

    .counter {
      position: absolute;
      bottom: 5px; right: 12px;
      font-size: 10px;
      color: rgba(0,0,0,0.35);
      pointer-events: none;
    }

    /* ── Controls ── */
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 11px 22px;
      border: 3px solid #333;
      border-radius: 10px;
      font-size: 1em;
      font-family: inherit;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.1s, box-shadow 0.1s;
      box-shadow: 3px 3px 0 #333;
    }
    .btn:hover  { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 #333; }
    .btn:active { transform: translate(2px, 2px);  box-shadow: 1px 1px 0 #333; }
    .btn-random { background: #FFD93D; }
    .btn-name   { background: #A8EDEA; }

    .name-display {
      margin-top: 16px;
      font-size: 1.35em;
      color: #6C5CE7;
      font-weight: bold;
      min-height: 1.8em;
      text-align: center;
      text-shadow: 1px 1px 0 rgba(108,92,231,0.2);
      transition: opacity 0.3s;
    }

    /* ── Keyboard hint ── */
    .hint {
      margin-top: 18px;
      font-size: 0.78em;
      color: #999;
      text-align: center;
      line-height: 1.8;
    }
    .key {
      display: inline-block;
      background: #eee;
      border: 1px solid #bbb;
      border-radius: 4px;
      padding: 1px 6px;
      font-family: monospace;
      font-size: 0.95em;
    }
  </style>
</head>
<body>

<h1>🎭 Flip Book Fun!</h1>
<p class="subtitle">Mix &amp; match heads, bodies &amp; feet to create silly creatures!</p>

<div class="flipbook">
  <!-- HEAD -->
  <div class="section">
    <button class="nav-btn prev" onclick="flip('head',-1)" title="Previous head">&#9664;</button>
    <span class="section-label">HEAD</span>
    <div class="section-inner" id="head-inner"></div>
    <span class="counter" id="head-counter"></span>
    <button class="nav-btn next" onclick="flip('head', 1)" title="Next head">&#9654;</button>
  </div>

  <!-- BODY -->
  <div class="section">
    <button class="nav-btn prev" onclick="flip('body',-1)" title="Previous body">&#9664;</button>
    <span class="section-label">BODY</span>
    <div class="section-inner" id="body-inner"></div>
    <span class="counter" id="body-counter"></span>
    <button class="nav-btn next" onclick="flip('body', 1)" title="Next body">&#9654;</button>
  </div>

  <!-- FEET -->
  <div class="section">
    <button class="nav-btn prev" onclick="flip('feet',-1)" title="Previous feet">&#9664;</button>
    <span class="section-label">FEET</span>
    <div class="section-inner" id="feet-inner"></div>
    <span class="counter" id="feet-counter"></span>
    <button class="nav-btn next" onclick="flip('feet', 1)" title="Next feet">&#9654;</button>
  </div>
</div>

<div class="controls">
  <button class="btn btn-random" onclick="randomize()">🎲 Randomize!</button>
  <button class="btn btn-name"   onclick="showName()">📛 Name This Creature!</button>
</div>

<div class="name-display" id="name-display"></div>

<p class="hint">
  Keyboard: <span class="key">Q</span>/<span class="key">E</span> head &nbsp;
  <span class="key">A</span>/<span class="key">D</span> body &nbsp;
  <span class="key">Z</span>/<span class="key">C</span> feet &nbsp;
  <span class="key">R</span> random &nbsp;
  <span class="key">N</span> name
</p>

// =============================================================================
// APP STATE & LOGIC
// =============================================================================
const state = { head: 0, body: 0, feet: 0 };

const parts = { head: heads, body: bodies, feet: feet };

function render(section) {
  document.getElementById(section + '-inner').innerHTML = parts[section][state[section]];
  const n = parts[section].length;
  document.getElementById(section + '-counter').textContent = `${state[section] + 1} / ${n}`;
}

function flip(section, dir) {
  const n = parts[section].length;
  const inner = document.getElementById(section + '-inner');

  // Trigger animation
  inner.classList.remove('flipping');
  void inner.offsetWidth; // force reflow to restart animation
  inner.classList.add('flipping');

  // Swap content at the halfway point (content appears to flip in)
  setTimeout(() => {
    state[section] = ((state[section] + dir) + n) % n;
    render(section);
  }, 175);

  setTimeout(() => inner.classList.remove('flipping'), 360);
}

function randomize() {
  ['head', 'body', 'feet'].forEach(s => {
    state[s] = Math.floor(Math.random() * parts[s].length);
    render(s);
  });
  showName();
}

// ── Creature name generator ──
const adj1   = ['Fuzzy','Slimy','Bumpy','Wobbly','Spiky','Grumpy','Giggly','Stinky','Wriggly','Flappy','Soggy','Crunchy'];
const adj2   = ['Noggin','Tummy','Toes','Belly','Snout','Chomper','Wiggle','Squirm','Grumble','Wobble','Jiggles','Blobkins'];
const suffix = ['the Mighty','of the Deep','the Ridiculous','the Confused','McSillypants','the Unstoppable','Jr.','the First','3000','the Brave','of Doom','the Smelly'];

function showName() {
  const display = document.getElementById('name-display');
  display.style.opacity = '0';
  setTimeout(() => {
    const a = adj1[Math.floor(Math.random() * adj1.length)];
    const b = adj2[Math.floor(Math.random() * adj2.length)];
    const c = suffix[Math.floor(Math.random() * suffix.length)];
    display.textContent = `${a} ${b} ${c}`;
    display.style.opacity = '1';
  }, 150);
}

// ── Touch / swipe support ──
let touchStart = {};
document.querySelectorAll('.section').forEach((el, i) => {
  const sectionName = ['head', 'body', 'feet'][i];
  el.addEventListener('touchstart', e => { touchStart[sectionName] = e.touches[0].clientX; }, { passive: true });
  el.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - (touchStart[sectionName] || 0);
    if (Math.abs(dx) > 40) flip(sectionName, dx < 0 ? 1 : -1);
  });
});

// ── Keyboard support ──
document.addEventListener('keydown', e => {
  switch (e.key) {
    case 'q': case 'Q': flip('head', -1); break;
    case 'e': case 'E': flip('head',  1); break;
    case 'a': case 'A': flip('body', -1); break;
    case 'd': case 'D': flip('body',  1); break;
    case 'z': case 'Z': flip('feet', -1); break;
    case 'c': case 'C': flip('feet',  1); break;
    case 'r': case 'R': randomize();      break;
    case 'n': case 'N': showName();       break;
  }
});

// ── Init ──
window.onload = () => { render('head'); render('body'); render('feet'); };
</script>
